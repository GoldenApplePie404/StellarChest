version: '3.8'

services:
  galgame_toolkit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: galgame_toolkit
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:./data/galgame_toolkit.db
      - JWT_SECRET=${JWT_SECRET:-default-secret-change-in-production}
      - JWT_EXPIRES_IN=7d
      - PORT=3000
      - DATA_DIR=./data
    volumes:
      # 数据目录持久化（数据库+上传文件+导出文件）
      - galgame_data:/app/data
    restart: unless-stopped

volumes:
  galgame_data:
    driver: local
